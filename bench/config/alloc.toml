# compares compile-time block allocation strategies, preflight builds one module per strategy.
# see BSFS_ALLOC in the top-level Makefile and tests/alloc_matrix.sh for the correctness side.
[run]
repetitions = 10
seeds = [1234, 5678, 9012, 3456, 7890, 2345, 6789, 1357, 2468, 8642]
filesystems = ["bsfs-linear", "bsfs-heap", "bsfs-twolevel"]
common_cpu = "auto"
concurrency_cpus = "auto"

[device]
min_gib = 4
max_gib = 16
loop_size_mib = 1024
discard = false

[scenarios]
common = ["bulk", "metadata", "mixed"]
concurrency = ["concurrency-seq", "concurrency-mixed"]
