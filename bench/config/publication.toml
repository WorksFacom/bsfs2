[run]
profile = "publication"
repetitions = 5
seeds = [1234, 5678, 9012, 3456, 7890]
filesystems = ["bsfs", "old-bsfs", "ext4", "btrfs", "zfs"]
common_cpu = "auto"
concurrency_cpus = "auto"

[device]
min_gib = 4
max_gib = 16
loop_size_mib = 4096
discard = true

[scenarios]
common = ["bulk", "metadata", "mixed"]
concurrency = ["concurrency-seq", "concurrency-mixed"]

